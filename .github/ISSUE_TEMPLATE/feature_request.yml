name: Feature request
description: An idea that would make Foldcraft better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Foldcraft has one firm promise: it changes how folders look and can never damage anything. Ideas that keep that promise are very welcome.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the wish, not only the solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you've tried?
    validations:
      required: false
