name: Bug report
description: Something doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please leave out anything personal: paths with your account name in them are fine to shorten, like `C:\Users\you\...`. If this is a security problem, don't file it here. See SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a new empty folder on the Customize screen
        2. Pick a color and press Apply
        3. ...
    validations:
      required: true

  - type: input
    id: foldcraft-version
    attributes:
      label: Foldcraft version
      description: Shown on the About screen.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Press Win + R and run `winver` to see it.
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: dropdown
    id: folder-kind
    attributes:
      label: Where is the folder?
      options:
        - On a local drive
        - In OneDrive or another cloud service
        - On a removable drive
        - Not about a particular folder
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: If Foldcraft showed an error, paste the matching lines from `foldcraft.log` in its data folder. You can open that folder from Settings.
      render: text
    validations:
      required: false
